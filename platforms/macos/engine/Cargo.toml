[package]
name = "avrobangla-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "avrobangla_engine"
crate-type = ["staticlib"]

[dependencies]
riti = { path = "../../../vendor/rust/riti" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

