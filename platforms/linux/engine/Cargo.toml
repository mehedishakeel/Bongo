[package]
name = "bongo-engine-linux"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"
description = "Bongo phonetic engine library for Linux"

[lib]
name = "bongo_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
riti = { git = "https://github.com/OpenBangla/riti.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
