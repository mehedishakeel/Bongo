name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Apple Silicon and Intel Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS DMGs (Apple Silicon, Intel, Universal)
        run: |
          ./platforms/macos/scripts/create-dmg.sh all

      - name: Generate Checksums
        run: |
          cd platforms/macos/release
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              shasum -a 256 "$dmg" > "${dmg}.sha256"
              echo "Generated checksum for $dmg:"
              cat "${dmg}.sha256"
            fi
          done

      - name: Upload DMG Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bongo-macos-dmgs
          path: |
            platforms/macos/release/*.dmg
            platforms/macos/release/*.sha256

  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    # Pin the oldest supported runners so prebuilt binaries keep the glibc 2.39
    # floor documented in the README. Moving to a newer image raises it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install IBus, Fcitx5 & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libibus-1.0-dev libfcitx5core-dev cmake ninja-build fcitx5 python3-gi gir1.2-gtk-4.0

      - name: Build Debian Package
        run: |
          bash platforms/linux/scripts/build-deb.sh

      - name: Build Universal Linux Tarball
        run: |
          bash platforms/linux/scripts/build-tarball.sh

      - name: Smoke-test Prebuilt Install
        run: |
          tarball="$(ls platforms/linux/release/Bongo-*-linux-${{ matrix.arch }}.tar.gz)"
          tmp="$(mktemp -d)"
          tar -xzf "$tarball" -C "$tmp"
          cd "$tmp"/Bongo-*-linux-${{ matrix.arch }}
          sudo bash install.sh --prebuilt --no-configure-fcitx5
          python3 -c 'import ctypes; ctypes.CDLL("/usr/lib/bongo/libbongo_engine.so")'
          addon="$(find /usr/lib* -path '*/fcitx5/libbongo.so' -print -quit 2>/dev/null)"
          test -n "$addon"
          ldd -r "$addon" 2>&1 | tee /tmp/bongo-ldd.txt
          ! grep -qE 'not found|undefined symbol' /tmp/bongo-ldd.txt
          test -f /usr/share/fcitx5/addon/bongo.conf
          sudo bash install.sh --uninstall
          test ! -e /usr/bin/bongo-settings

      - name: Generate Checksums
        run: |
          cd platforms/linux/release
          for artifact in *.deb *.tar.gz; do
            if [ -f "$artifact" ]; then
              shasum -a 256 "$artifact" > "${artifact}.sha256"
              echo "Generated checksum for $artifact:"
              cat "${artifact}.sha256"
            fi
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bongo-linux-packages-${{ matrix.arch }}
          path: |
            platforms/linux/release/*.deb
            platforms/linux/release/*.tar.gz
            platforms/linux/release/*.sha256

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Packaging Tools
        shell: pwsh
        run: |
          choco install innosetup wixtoolset -y --no-progress

      - name: Build Windows Packages
        shell: cmd
        run: |
          call platforms\windows\scripts\build-windows.bat

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bongo-windows-packages
          path: |
            platforms/windows/release/*.exe
            platforms/windows/release/*.msi
            platforms/windows/release/*.zip
            platforms/windows/release/*.sha256

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android APK
        run: |
          cd platforms/android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          mkdir -p release
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="1.1.0"
          fi
          cp app/build/outputs/apk/release/app-release.apk "release/Bongo-${VERSION}-android.apk"
          cd release
          shasum -a 256 "Bongo-${VERSION}-android.apk" > "Bongo-${VERSION}-android.apk.sha256"
          echo "Generated checksum for Bongo-${VERSION}-android.apk:"
          cat "Bongo-${VERSION}-android.apk.sha256"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bongo-android-apk
          path: |
            platforms/android/release/*.apk
            platforms/android/release/*.sha256

  publish:
    name: Publish Release
    needs: [build-dmg, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Metadata
        id: release_meta
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          NOTE_FILE="docs/releases/${TAG_NAME}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "body_path=$NOTE_FILE" >> $GITHUB_OUTPUT
          else
            echo "body_path=" >> $GITHUB_OUTPUT
          fi
          if [ "$TAG_NAME" = "v1.1.0" ]; then
            echo "title=Bongo v1.1.0 — National (Bijoy) Layout & Native Fcitx5 Frontend" >> $GITHUB_OUTPUT
          else
            echo "title=Bongo $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          body_path: ${{ steps.release_meta.outputs.body_path }}
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.deb
            release-artifacts/*.tar.gz
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/*.apk
            release-artifacts/*.sha256
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
